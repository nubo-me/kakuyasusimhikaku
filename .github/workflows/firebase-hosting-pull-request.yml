name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAKUYASUSIMHIKAKU_6C501 }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: kakuyasusimhikaku-6c501
          firebaseToolsVersion: '13.20.2'
      - name: Skip deploy (missing FIREBASE_SERVICE_ACCOUNT secret)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "FIREBASE_SERVICE_ACCOUNT_KAKUYASUSIMHIKAKU_6C501 is not set; skipping preview deploy."
