name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Deploy to Firebase Hosting (live)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAKUYASUSIMHIKAKU_6C501 }}
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ github.token }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
          channelId: live
          projectId: kakuyasusimhikaku-6c501
          firebaseToolsVersion: '13.20.2'
      - name: Skip deploy (missing FIREBASE_SERVICE_ACCOUNT secret)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAKUYASUSIMHIKAKU_6C501 }}
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "FIREBASE_SERVICE_ACCOUNT_KAKUYASUSIMHIKAKU_6C501 is not set; skipping deploy."
